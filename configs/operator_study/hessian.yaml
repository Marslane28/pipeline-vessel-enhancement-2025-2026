# configs/operator_study/hessian.yaml
# Pilote Comparaison_hessian.py via : python3 main.py --run_operator_study --study_type hessian

mode: "hessian"
results_dir: "hessian_benchmark"
seed: 42
verbose: true
plot: true

geometry:
  shape: [64, 64, 64]
  sigma_vessel: 2.0
  vessel_radius: 4.0

methods:
  custom:
    - "farid"
    - "cubic"
    - "trigonometric"
    - "catmull"
    - "bspline"
    - "bezier"
    - "scharr"
  skimage:
    - "default"
    - "gaussian"

cases:
  simple: "simple_vessel"
  curved: "curved_vessel"
  bifurcation: "bifurcation"

noise:
  snr_db: 20.0

timing:
  n_repeats: 7
  warmup: 1

mode: "segmentation"
results_dir: "segmentation_benchmark"
seed: 42
verbose: true
plot: true

geometry:
  shape: [64, 64, 64]
  sigma_vessel: 2.0
  vessel_radius: 4.0

methods:
  custom:
    - "farid"
    - "cubic"
    - "trigonometric"
    - "catmull"
    - "bspline"
    - "bezier"
    - "scharr"
  skimage:
    - "default"
    - "gaussian"

cases:
  simple: "simple_vessel"
  curved: "curved_vessel"
  bifurcation: "bifurcation"

scales: [1.0, 1.5, 2.0, 2.5, 3.0]
filters_to_test: ["frangi", "jerman","mfat"]
black_ridges: false

# Volumes 64^3 : peu coûteux, laisser à false. Passer à true pour désactiver
# la squelettisation/détection de bifurcations si le coût devient trop élevé
# sur un balayage plus large (plus de méthodes, plus d'échelles).
skip_bifurcation: false

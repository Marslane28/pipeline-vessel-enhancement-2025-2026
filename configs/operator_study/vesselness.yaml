# configs/operator_study/vesselness.yaml
# Pilote Comparaison_vesselness.py via : python3 main.py --run_operator_study --study_type vesselness

mode: "vesselness"
results_dir: "vesselness_benchmark"
seed: 42
verbose: true
plot: true

geometry:
  shape: [64, 64, 64]
  sigma_vessel: 2.0
  vessel_radius: 4.0

methods:
  custom:
    - "farid"
    - "cubic"
    - "trigonometric"
    - "catmull"
    - "bspline"
    - "bezier"
    - "scharr"
  skimage:
    - "default"
    - "gaussian"

cases:
  simple: "simple_vessel"
  curved: "curved_vessel"
  bifurcation: "bifurcation"
  
scales: [1.0, 1.5, 2.0, 2.5, 3.0]
filters_to_test: ["frangi", "jerman","mfat"]

# Vaisseau plus clair que le fond dans AnalyticalVessel.
black_ridges: false
